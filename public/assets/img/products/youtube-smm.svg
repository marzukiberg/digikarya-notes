<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="ytGlow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#880000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0c0707" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e1e"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
    <linearGradient id="ytCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1111"/>
      <stop offset="100%" stop-color="#130b0b"/>
    </linearGradient>
    <filter id="ytShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#0d0808"/>
  <rect width="1080" height="1080" fill="url(#ytGlow)"/>

  <!-- Top Bar -->
  <g transform="translate(80, 80)">
    <rect width="270" height="52" rx="26" fill="#201212" stroke="#381d1d" stroke-width="2"/>
    <circle cx="28" cy="26" r="10" fill="#ff0000"/>
    <text x="50" y="33" fill="#ffffff" font-family="'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="1">DIGIKARYA · YOUTUBE</text>
  </g>

  <g transform="translate(740, 80)">
    <rect width="260" height="52" rx="26" fill="#ff0000" opacity="0.15"/>
    <rect width="260" height="52" rx="26" fill="none" stroke="#ff0000" stroke-width="2"/>
    <text x="130" y="33" fill="#ff4d4d" font-family="'Inter', sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="2">BERGARANSI REFILL</text>
  </g>

  <!-- YouTube Play Icon Badge -->
  <g transform="translate(740, 240)" filter="url(#ytShadow)">
    <circle cx="120" cy="120" r="110" fill="#1d1111" stroke="#3b1d1d" stroke-width="3"/>
    <rect x="45" y="70" width="150" height="100" rx="30" fill="#ff0000"/>
    <polygon points="105,95 145,120 105,145" fill="#ffffff"/>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 240)">
    <text x="0" y="50" fill="#ff5555" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" letter-spacing="4">YOUTUBE ENGAGEMENT</text>
    <text x="0" y="130" fill="#ffffff" font-family="'Inter', sans-serif" font-size="74" font-weight="900" letter-spacing="-2">VIEWS + LIKES</text>
    <text x="0" y="210" fill="#ffffff" font-family="'Inter', sans-serif" font-size="74" font-weight="900" letter-spacing="-2">+ SHORTS LIKES</text>
    <text x="0" y="270" fill="#d1d5db" font-family="'Inter', sans-serif" font-size="28" font-weight="500">Performa video optimal &amp; tembus rekomendasi</text>
  </g>

  <!-- Bento Grid Items -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="440" height="140" rx="20" fill="url(#ytCardGrad)" stroke="#381d1d" stroke-width="2"/>
    <circle cx="60" cy="70" r="30" fill="#ff0000" opacity="0.15"/>
    <text x="60" y="77" fill="#ff5555" font-family="'Inter', sans-serif" font-size="26" font-weight="900" text-anchor="middle">▶</text>
    <text x="110" y="58" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="700">High Quality Views</text>
    <text x="110" y="90" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="18">Retention stabil &amp; organik</text>

    <rect x="480" y="0" width="440" height="140" rx="20" fill="url(#ytCardGrad)" stroke="#381d1d" stroke-width="2"/>
    <circle cx="540" cy="70" r="30" fill="#ff0000" opacity="0.15"/>
    <text x="540" y="77" fill="#ff5555" font-family="'Inter', sans-serif" font-size="26" font-weight="900" text-anchor="middle">👍</text>
    <text x="590" y="58" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="700">Likes &amp; Shorts Likes</text>
    <text x="590" y="90" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="18">Meningkatkan sinyal interaksi</text>

    <rect x="0" y="170" width="440" height="140" rx="20" fill="url(#ytCardGrad)" stroke="#381d1d" stroke-width="2"/>
    <circle cx="60" cy="240" r="30" fill="#ff0000" opacity="0.15"/>
    <text x="60" y="247" fill="#ff5555" font-family="'Inter', sans-serif" font-size="26" font-weight="900" text-anchor="middle">🛡</text>
    <text x="110" y="228" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="700">Garansi &amp; Refill</text>
    <text x="110" y="260" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="18">Jaminan refill jika turun</text>

    <rect x="480" y="170" width="440" height="140" rx="20" fill="url(#ytCardGrad)" stroke="#381d1d" stroke-width="2"/>
    <circle cx="540" cy="240" r="30" fill="#ff0000" opacity="0.15"/>
    <text x="540" y="247" fill="#ff5555" font-family="'Inter', sans-serif" font-size="26" font-weight="900" text-anchor="middle">🔒</text>
    <text x="590" y="228" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="700">100% Aman Privasi</text>
    <text x="590" y="260" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="18">Hanya butuh tautan video publik</text>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(80, 910)">
    <rect width="920" height="100" rx="24" fill="#180e0e" stroke="#3a1c1c" stroke-width="2"/>
    <text x="40" y="60" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="22" font-weight="600">HARGA PAKET MULAI</text>
    <text x="340" y="66" fill="#ff4d4d" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Rp 8.000</text>
    <rect x="680" y="20" width="200" height="60" rx="30" fill="url(#ytGrad)"/>
    <text x="780" y="58" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800" text-anchor="middle">ORDER SHOPEE</text>
  </g>
</svg>