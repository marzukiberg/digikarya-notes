    <circle cx="540" cy="70" r="30" fill="#fe2c55" opacity="0.15"/>
    <text x="540" y="77" fill="#fe2c55" font-family="'Inter', sans-serif" font-size="26" font-weight="900" text-anchor="middle">⚡</text>
    <text x="590" y="58" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="700">Tanpa Password</text>
    <text x="590" y="90" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="18">Cukup kirimkan link video</text>

    <!-- Card 3 -->
