  <!-- Bottom Pricing Ribbon -->
  <g transform="translate(80, 910)">
    <rect width="920" height="100" rx="24" fill="#16161f" stroke="#2e2e3d" stroke-width="2"/>
    <text x="40" y="60" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="22" font-weight="600">HARGA PAKET MULAI</text>
    <text x="340" y="66" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Rp 3.000</text>
    <rect x="680" y="20" width="200" height="60" rx="30" fill="url(#cyanRed)"/>
    <text x="780" y="58" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800" text-anchor="middle">ORDER SHOPEE</text>
