    <text x="0" y="50" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" letter-spacing="4">TIKTOK TOOLS BOOSTER</text>
    <text x="0" y="130" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="74" font-weight="900" letter-spacing="-2">VIEWS + LIKES</text>
    <text x="0" y="210" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="74" font-weight="900" letter-spacing="-2">+ SAVES INDO</text>
    <text x="0" y="270" fill="#a1a1aa" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="500">Meningkatkan algoritma &amp; interaksi akun FYP</text>
