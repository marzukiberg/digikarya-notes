  <!-- TikTok Icon Motif -->
  <g transform="translate(740, 240)" filter="url(#softShadow)">
    <circle cx="120" cy="120" r="110" fill="#14141c" stroke="#2a2a38" stroke-width="3"/>
    <!-- TikTok Note SVG Shape -->
    <path d="M145 75 C145 95 155 110 175 115 L175 135 C158 135 145 128 135 120 L135 165 C135 192 112 215 85 215 C58 215 35 192 35 165 C35 138 58 115 85 115 C90 115 95 116 100 118 L100 142 C95 140 90 139 85 139 C71 139 60 151 60 165 C60 179 71 190 85 190 C99 190 110 179 110 165 L110 55 L145 55 Z" fill="#00f2fe" transform="translate(10, 5)"/>
    <path d="M145 75 C145 95 155 110 175 115 L175 135 C158 135 145 128 135 120 L135 165 C135 192 112 215 85 215 C58 215 35 192 35 165 C35 138 58 115 85 115 C90 115 95 116 100 118 L100 142 C95 140 90 139 85 139 C71 139 60 151 60 165 C60 179 71 190 85 190 C99 190 110 179 110 165 L110 55 L145 55 Z" fill="#fe2c55" transform="translate(0, 0)"/>
    <path d="M145 75 C145 95 155 110 175 115 L175 135 C158 135 145 128 135 120 L135 165 C135 192 112 215 85 215 C58 215 35 192 35 165 C35 138 58 115 85 115 C90 115 95 116 100 118 L100 142 C95 140 90 139 85 139 C71 139 60 151 60 165 C60 179 71 190 85 190 C99 190 110 179 110 165 L110 55 L145 55 Z" fill="#ffffff" transform="translate(5, 2)"/>
  </g>

  <!-- Big Title -->
