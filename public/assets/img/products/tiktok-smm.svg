    <circle cx="60" cy="240" r="30" fill="#38bdf8" opacity="0.15"/>
    <text x="60" y="247" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="26" font-weight="900" text-anchor="middle">★</text>
    <text x="110" y="228" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="700">Creator &amp; UMKM</text>
    <text x="110" y="260" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="18">Tingkatkan trust pembeli</text>

    <!-- Card 4 -->
    <rect x="480" y="170" width="440" height="140" rx="20" fill="url(#cardGrad)" stroke="#272730" stroke-width="2"/>
    <circle cx="540" cy="240" r="30" fill="#10b981" opacity="0.15"/>
    <text x="540" y="247" fill="#10b981" font-family="'Inter', sans-serif" font-size="26" font-weight="900" text-anchor="middle">🚀</text>
    <text x="590" y="228" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="700">Proses Kilat</text>
    <text x="590" y="260" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="18">Antrian otomatis 24 jam</text>
