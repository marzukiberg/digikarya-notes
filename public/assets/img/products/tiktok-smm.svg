  </g>

  <g transform="translate(740, 80)">
    <rect width="260" height="52" rx="26" fill="#fe2c55" opacity="0.15"/>
    <rect width="260" height="52" rx="26" fill="none" stroke="#fe2c55" stroke-width="2"/>
    <text x="130" y="33" fill="#fe2c55" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="2">PROSES OTOMATIS</text>
